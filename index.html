<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jig - Cybersecurity Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Chat History</h2>
                <button class="new-chat-button">+ New Chat</button>
            </div>
            <div class="sidebar-content">
                <!-- Placeholder for chat history links -->
                <p>No chats yet.</p>
            </div>
        </aside>
        <main id="chat-area">
            <div id="chat-history">
                <!-- Chat messages will be appended here -->
            </div>
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Type your message to Jig..." autocomplete="off">
                <button type="submit" id="send-button">Send</button>
            </form>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
